<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Waste Segregation — wet, dry or hazardous</title>
    <meta
      name="description"
      content="Identify household waste as wet, dry or hazardous from a photo or your camera, using Google's Gemini API."
    />
    <meta name="theme-color" content="#059669" />
    <!--
      The browser no longer talks to Google or the image host at all — those
      calls go through this site's own /api/* proxy, which holds the keys. What
      remains:

        nominatim.openstreetmap.org  the coordinates, for an address
        *.supabase.co                the report row (publishable key, by design)
        i.ibb.co                     hosted images, shown and embedded in PDFs

      Removing api.imgbb.com and generativelanguage.googleapis.com from
      connect-src is not cosmetic: if a future change tried to call either
      directly with a client-side key, the browser would block it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://i.ibb.co; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://nominatim.openstreetmap.org https://*.supabase.co https://i.ibb.co; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This application needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
